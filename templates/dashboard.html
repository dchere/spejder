<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>{{title}}</title>
        <style>
            body { font-family: Arial, sans-serif; margin: 24px; background: #f7f7f7; color: #111; }
            h1 { margin-bottom: 8px; }
            .controls { display: flex; gap: 8px; margin-bottom: 12px; }
            .mode-btn { border: 1px solid #bbb; background: #fff; border-radius: 8px; padding: 8px 12px; cursor: pointer; }
            .mode-btn.active { border-color: #0a58ca; font-weight: 700; }
            .grid { display: grid; gap: 12px; }
            .card { background: #fff; border: 1px solid #ddd; border-radius: 10px; padding: 12px; position: relative; }
            .easy-apply-card { border-color: #d7a127; box-shadow: inset 0 0 0 1px #f6d36b; }
            .easy-apply-badge { display: inline-block; margin-left: 6px; padding: 2px 8px; border-radius: 999px; border: 1px solid #d7a127; background: #fff6d9; color: #7a5a00; font-size: 11px; font-weight: 700; vertical-align: middle; }
            .card p { margin: 6px 0; }
            .skill-tags { display: inline-flex; flex-wrap: wrap; gap: 6px; vertical-align: middle; }
            .skill-tag { display: inline-block; padding: 2px 8px; border-radius: 999px; border: 1px solid #c9d6f0; background: #eef4ff; color: #1f3a6d; font-size: 12px; }
            .skill-tag-btn { cursor: pointer; }
            .pseudo-link { border: 0; padding: 0; background: none; color: #0a58ca; cursor: pointer; font: inherit; text-decoration: underline; }
            .pseudo-link:hover { color: #084298; }
            .skills-empty { color: #777; font-size: 12px; }
            .manual-status { display: inline-block; font-size: 11px; font-weight: 700; margin: 4px 0 8px 0; padding: 2px 8px; border-radius: 999px; }
            .manual-status.done { color: #114b1f; background: #e5f6e9; border: 1px solid #9ed3ab; }
            .manual-status.todo { color: #6b5a00; background: #fff8db; border: 1px solid #e4d08a; }
            .applied-manual-input { margin: 8px 0; padding: 8px; border: 1px dashed #c7d5ee; border-radius: 8px; background: #f7fbff; }
            .applied-manual-input p { margin: 0 0 6px 0; font-size: 12px; color: #1f3a6d; }
            .cover-letter-section { display: block; margin: 8px 0; }
            .cover-letter-wrap { display: block; margin: 0 0 6px 0; font-size: 12px; font-weight: 700; }
            .raw-append-input, .cover-letter-text { width: 100%; min-height: 120px; resize: vertical; border: 1px solid #c9d6f0; border-radius: 6px; padding: 8px; font-size: 12px; font-family: monospace; box-sizing: border-box; }
            .raw-append-btn, .cover-letter-btn { margin-top: 8px; border: 1px solid #0a58ca; color: #0a58ca; background: #fff; border-radius: 6px; padding: 6px 10px; cursor: pointer; }
            .raw-append-btn:disabled, .cover-letter-btn:disabled { opacity: 0.55; cursor: not-allowed; }
            .relevance-score { position: absolute; top: 8px; right: 10px; font-size: 11px; color: #9aa0a6; }
            .feedback { display: flex; gap: 8px; align-items: center; margin-top: 8px; flex-wrap: wrap; }
            .relevant-wrap { font-size: 13px; color: #333; display: inline-flex; gap: 5px; align-items: center; }
            .viewed-wrap { font-size: 13px; color: #333; display: inline-flex; gap: 5px; align-items: center; }
            .applied-wrap { font-size: 13px; color: #333; display: inline-flex; gap: 5px; align-items: center; }
            .interview-wrap { font-size: 13px; color: #333; display: inline-flex; gap: 5px; align-items: center; }
            .stopped-wrap { font-size: 13px; color: #333; display: inline-flex; gap: 5px; align-items: center; }
            .company-feedback-input { margin: 8px 0; padding: 8px; border: 1px dashed #d8c7ee; border-radius: 8px; background: #faf7ff; }
            .company-feedback-input p { margin: 0 0 6px 0; font-size: 12px; color: #4a2d6d; }
            .company-feedback-text { width: 100%; min-height: 80px; resize: vertical; border: 1px solid #d8c7ee; border-radius: 6px; padding: 8px; font-size: 12px; box-sizing: border-box; }
            .company-feedback-btn { margin-top: 8px; border: 1px solid #6f42c1; color: #6f42c1; background: #fff; border-radius: 6px; padding: 6px 10px; cursor: pointer; }
            .feedback-status { font-size: 12px; color: #555; }
            a { color: #0a58ca; word-break: break-all; }
            .hidden { display: none; }
            .empty { background: #fff; border: 1px dashed #ccc; border-radius: 10px; padding: 12px; margin: 0; }
            .skills-wrap { background: #fff; border: 1px solid #ddd; border-radius: 10px; padding: 12px; overflow-x: auto; }
            .skills-table { width: 100%; border-collapse: collapse; min-width: 900px; }
            .skills-table th, .skills-table td { border-bottom: 1px solid #eee; text-align: left; padding: 8px; font-size: 13px; }
            .skills-table th { background: #fafafa; font-weight: 700; }
            .skills-table th.skills-sortable { cursor: pointer; user-select: none; white-space: nowrap; }
            .skills-table th.skills-sortable:hover { background: #f0f4fa; }
            .skills-sort-indicator { display: inline-block; width: 0.9em; margin-left: 4px; color: #6b7a99; font-size: 11px; }
            .skills-table th.skills-sort-active .skills-sort-indicator::after { content: '▲'; }
            .skills-table th.skills-sort-active.skills-sort-desc .skills-sort-indicator::after { content: '▼'; }
            .skills-table tbody tr.skill-row-focus { outline: 2px solid #0a58ca; outline-offset: -2px; background: #eef4ff; transition: background-color 0.8s ease; }
            .delete-skill-btn { border: 1px solid #cc8c8c; color: #7b1111; background: #fff; border-radius: 6px; padding: 4px 8px; cursor: pointer; }
            .block-skill-btn { border: 1px solid #d2a24a; color: #7a5200; background: #fff7e8; border-radius: 6px; padding: 4px 8px; cursor: pointer; margin-right: 6px; }
            .regenerate-btn { margin-left: auto; border: 1px solid #6c757d; color: #495057; background: #fff; border-radius: 8px; padding: 8px 12px; cursor: pointer; }
            .regenerate-btn:disabled, .sync-inbox-btn:disabled { opacity: 0.55; cursor: not-allowed; }
            .sync-inbox-btn { border: 1px solid #0a58ca; color: #0a58ca; background: #fff; border-radius: 8px; padding: 8px 12px; cursor: pointer; }
            .regenerate-status, .sync-inbox-status { margin-left: 8px; font-size: 12px; color: #555; align-self: center; }
            .portrait-wrap { background: #fff; border: 1px solid #ddd; border-radius: 10px; padding: 12px; }
            .portrait-toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
            .portrait-btn { border: 1px solid #0a58ca; color: #0a58ca; background: #fff; border-radius: 6px; padding: 6px 10px; cursor: pointer; }
            .portrait-btn:disabled { opacity: 0.55; cursor: not-allowed; }
            .portrait-save-btn { border-color: #198754; color: #198754; }
            .portrait-status { font-size: 12px; color: #555; }
            .portrait-empty { margin: 0 0 12px 0; font-size: 13px; color: #555; }
            .portrait-editor { width: 100%; min-height: 360px; resize: vertical; border: 1px solid #c9d6f0; border-radius: 6px; padding: 8px; font-size: 13px; font-family: monospace; box-sizing: border-box; }
            .portrait-diff-wrap { margin-bottom: 12px; border: 1px solid #ddd; border-radius: 8px; overflow: auto; max-height: 280px; }
            .portrait-diff-wrap.hidden { display: none; }
            .portrait-diff { margin: 0; padding: 8px; font-size: 12px; font-family: monospace; white-space: pre-wrap; word-break: break-word; }
            .diff-line-ctx { color: #333; background: #fff; }
            .diff-line-add { color: #116329; background: #e6ffed; }
            .diff-line-del { color: #82071e; background: #ffeef0; }
        </style>
    </head>
    <body>
        <h1>{{title}}</h1>
        <div class="controls">
            <button id="btn-relevant" class="mode-btn active" type="button" data-total="{{ relevant_total_count }}">Relevant ({{ len_relevant_items }}/{{ relevant_total_count }})</button>
            <button id="btn-not-relevant" class="mode-btn" type="button" data-total="{{ not_relevant_total_count }}">Not relevant ({{ len_not_relevant_items }}/{{ not_relevant_total_count }})</button>
            <button id="btn-applied" class="mode-btn" type="button">Applied ({{ len_applied_items }})</button>
            <button id="btn-interview" class="mode-btn" type="button">Interview ({{ len_interview_items }})</button>
            <button id="btn-stopped" class="mode-btn" type="button">Stopped ({{ len_stopped_items }})</button>
            <button id="btn-skills" class="mode-btn" type="button">Skills ({{ len_skills_items }})</button>
            <button id="btn-portrait" class="mode-btn" type="button">Portrait</button>
            <button id="btn-sync-inbox" class="sync-inbox-btn" type="button" onclick="syncInbox(this)">Sync inbox</button>
            <span id="sync-inbox-status" class="sync-inbox-status"></span>
            <button id="btn-regenerate" class="regenerate-btn" type="button" onclick="regenerateReport(this)">Regenerate report</button>
            <span id="regenerate-status" class="regenerate-status"></span>
        </div>
        <section id="panel-relevant" class="grid">{{ relevant_cards }}</section>
        <section id="panel-not-relevant" class="grid hidden">{{ not_relevant_cards }}</section>
        <section id="panel-applied" class="grid hidden">{{ applied_cards }}</section>
        <section id="panel-interview" class="grid hidden">{{ interview_cards }}</section>
        <section id="panel-stopped" class="grid hidden">{{ stopped_cards }}</section>
        <section id="panel-skills" class="skills-wrap hidden">{{ skills_table_html }}</section>
        <section id="panel-portrait" class="portrait-wrap hidden">
            <div class="portrait-toolbar">
                <button id="btn-portrait-generate" class="portrait-btn" type="button" onclick="regeneratePortrait(this)">Regenerate portrait</button>
                <button id="btn-portrait-save" class="portrait-btn portrait-save-btn" type="button" onclick="savePortrait(this)">Save portrait</button>
                <span id="portrait-status" class="portrait-status"></span>
            </div>
            {% if not has_portrait %}
            <p class="portrait-empty">No portrait yet. Add CV text, skills, or applied jobs, then Regenerate portrait.</p>
            {% endif %}
            <div id="portrait-diff-wrap" class="portrait-diff-wrap hidden">
                <div id="portrait-diff"></div>
            </div>
            <textarea id="portrait-editor" class="portrait-editor">{{ portrait_text }}</textarea>
        </section>

        <script>
            const btnRelevant = document.getElementById('btn-relevant');
            const btnNotRelevant = document.getElementById('btn-not-relevant');
            const btnApplied = document.getElementById('btn-applied');
            const btnInterview = document.getElementById('btn-interview');
            const btnStopped = document.getElementById('btn-stopped');
            const btnSkills = document.getElementById('btn-skills');
            const btnPortrait = document.getElementById('btn-portrait');
            const panelRelevant = document.getElementById('panel-relevant');
            const panelNotRelevant = document.getElementById('panel-not-relevant');
            const panelApplied = document.getElementById('panel-applied');
            const panelInterview = document.getElementById('panel-interview');
            const panelStopped = document.getElementById('panel-stopped');
            const panelSkills = document.getElementById('panel-skills');
            const panelPortrait = document.getElementById('panel-portrait');
            const portraitEditor = document.getElementById('portrait-editor');
            const portraitDiffWrap = document.getElementById('portrait-diff-wrap');
            const portraitDiff = document.getElementById('portrait-diff');
            const portraitStatus = document.getElementById('portrait-status');
            const appliedStagePanels = [panelApplied, panelInterview, panelStopped];
            let portraitCommitted = portraitEditor ? portraitEditor.value : '';
            let portraitDraftPending = false;
            let currentMode = 'relevant';

            function apiUrl(path) {
                if (window.location.protocol === 'file:') {
                    return `http://127.0.0.1:8765${path}`;
                }
                return path;
            }

            async function reportLastModified() {
                const response = await fetch(apiUrl('/report.html'), { method: 'HEAD', cache: 'no-store' });
                if (!response.ok) {
                    throw new Error('Failed to read report status');
                }
                return response.headers.get('Last-Modified') || '';
            }

            function sleep(ms) {
                return new Promise((resolve) => setTimeout(resolve, ms));
            }

            let syncPollTimer = null;

            async function fetchSyncStatus() {
                const response = await fetch(apiUrl('/api/inbox/sync/status'), { cache: 'no-store' });
                if (!response.ok) {
                    throw new Error('Failed to read sync status');
                }
                return response.json();
            }

            function applySyncStatus(data, btnEl, statusEl) {
                const running = Boolean(data.running);
                btnEl.disabled = running;
                if (running) {
                    statusEl.textContent = data.stage_message || data.message || 'Syncing…';
                    return;
                }
                const status = data.status || 'idle';
                if (status === 'complete') {
                    statusEl.textContent = data.message || 'Sync complete — reload the page to see new positions';
                } else if (status === 'skipped') {
                    statusEl.textContent = data.message || 'Nothing to sync — inbox is empty and descriptions are up to date';
                } else if (status === 'failed') {
                    statusEl.textContent = data.message || 'Sync failed';
                } else {
                    statusEl.textContent = '';
                }
            }

            async function pollSyncStatus(btnEl, statusEl) {
                try {
                    const data = await fetchSyncStatus();
                    applySyncStatus(data, btnEl, statusEl);
                    if (data.running) {
                        syncPollTimer = setTimeout(() => pollSyncStatus(btnEl, statusEl), 2000);
                    }
                } catch (err) {
                    statusEl.textContent = `Error: ${err.message}`;
                    btnEl.disabled = false;
                }
            }

            async function syncInbox(btnEl) {
                const statusEl = document.getElementById('sync-inbox-status');
                if (syncPollTimer) {
                    clearTimeout(syncPollTimer);
                    syncPollTimer = null;
                }
                btnEl.disabled = true;
                statusEl.textContent = 'Starting sync…';
                try {
                    const response = await fetch(apiUrl('/api/inbox/sync'), {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                    });
                    const data = await response.json();
                    if (!response.ok || !data.ok) {
                        throw new Error(data.error || 'Request failed');
                    }
                    pollSyncStatus(btnEl, statusEl);
                } catch (err) {
                    statusEl.textContent = `Error: ${err.message}`;
                    btnEl.disabled = false;
                }
            }

            async function initInboxSyncStatus() {
                const btnEl = document.getElementById('btn-sync-inbox');
                const statusEl = document.getElementById('sync-inbox-status');
                if (!btnEl || !statusEl) {
                    return;
                }
                try {
                    const data = await fetchSyncStatus();
                    applySyncStatus(data, btnEl, statusEl);
                    if (data.running) {
                        pollSyncStatus(btnEl, statusEl);
                    }
                } catch (_) {
                    // Status endpoint unavailable when opened as a static file.
                }
            }

            async function regenerateReport(btnEl) {
                const statusEl = document.getElementById('regenerate-status');
                btnEl.disabled = true;
                if (statusEl) statusEl.textContent = 'Regenerating…';
                try {
                    const beforeMtime = await reportLastModified();
                    const response = await fetch(apiUrl('/api/report/rebuild'), {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                    });
                    const data = await response.json();
                    if (!response.ok || !data.ok) {
                        throw new Error(data.error || 'Request failed');
                    }
                    const deadline = Date.now() + 60000;
                    while (Date.now() < deadline) {
                        await sleep(500);
                        const afterMtime = await reportLastModified();
                        if (afterMtime && afterMtime !== beforeMtime) {
                            location.reload();
                            return;
                        }
                    }
                    if (statusEl) {
                        statusEl.textContent = 'Rebuild queued — refresh manually if the page does not update';
                    }
                    btnEl.disabled = false;
                } catch (err) {
                    if (statusEl) {
                        statusEl.textContent = `Error: ${err.message}. Start: python -m spejder.cli serve-gui`;
                    }
                    btnEl.disabled = false;
                }
            }

            function ensureEmptyState(panel) {
                const hasCards = panel.querySelector('.card') !== null;
                let emptyEl = panel.querySelector('.empty');
                if (!hasCards && !emptyEl) {
                    emptyEl = document.createElement('p');
                    emptyEl.className = 'empty';
                    emptyEl.textContent = 'No records found.';
                    panel.appendChild(emptyEl);
                }
                if (hasCards && emptyEl) {
                    emptyEl.remove();
                }
            }

            function bumpPanelTotal(panel, delta) {
                let btn = null;
                if (panel === panelRelevant) btn = btnRelevant;
                if (panel === panelNotRelevant) btn = btnNotRelevant;
                if (!btn) return;
                const current = Number.parseInt(btn.dataset.total || '0', 10) || 0;
                btn.dataset.total = String(Math.max(0, current + delta));
            }

            function refreshCounts() {
                const relevantCount = panelRelevant.querySelectorAll('.card').length;
                const notRelevantCount = panelNotRelevant.querySelectorAll('.card').length;
                const appliedCount = panelApplied.querySelectorAll('.card').length;
                const interviewCount = panelInterview.querySelectorAll('.card').length;
                const stoppedCount = panelStopped.querySelectorAll('.card').length;
                const skillsCount = panelSkills.querySelectorAll('tbody tr').length;
                const relevantTotal = Number.parseInt(btnRelevant.dataset.total || String(relevantCount), 10) || relevantCount;
                const notRelevantTotal = Number.parseInt(btnNotRelevant.dataset.total || String(notRelevantCount), 10) || notRelevantCount;
                btnRelevant.textContent = `Relevant (${relevantCount}/${relevantTotal})`;
                btnNotRelevant.textContent = `Not relevant (${notRelevantCount}/${notRelevantTotal})`;
                btnApplied.textContent = `Applied (${appliedCount})`;
                btnInterview.textContent = `Interview (${interviewCount})`;
                btnStopped.textContent = `Stopped (${stoppedCount})`;
                btnSkills.textContent = `Skills (${skillsCount})`;
                ensureEmptyState(panelRelevant);
                ensureEmptyState(panelNotRelevant);
                ensureEmptyState(panelApplied);
                ensureEmptyState(panelInterview);
                ensureEmptyState(panelStopped);
            }

            function appliedStagePanel(card) {
                const onInterview = card.querySelector('.interview-wrap input')?.checked;
                const stopped = card.querySelector('.stopped-wrap input')?.checked;
                if (onInterview) return panelInterview;
                if (stopped) return panelStopped;
                return panelApplied;
            }

            function moveCardToAppliedStage(card) {
                const targetPanel = appliedStagePanel(card);
                if (card.parentElement !== targetPanel) targetPanel.prepend(card);
                syncAppliedStageUI(card);
            }

            function ensureCompanyFeedbackUI(card) {
                if (!card) return;
                const saved = card.querySelector('.company-feedback-text')?.value
                    || card.getAttribute('data-company-feedback')
                    || '';
                if (card.querySelector('.company-feedback-input')) {
                    const existing = card.querySelector('.company-feedback-text');
                    if (existing && saved && !existing.value) existing.value = saved;
                    return;
                }
                const jobId = card.getAttribute('data-job-id');
                const block = document.createElement('div');
                block.className = 'company-feedback-input';
                block.innerHTML = `
                    <p><strong>Company feedback</strong></p>
                    <textarea class="company-feedback-text" placeholder="Notes from the company..."></textarea>
                    <div><button type="button" class="company-feedback-btn" onclick="saveCompanyFeedback(${jobId}, this)">Save feedback</button></div>
                `.trim();
                const textarea = block.querySelector('.company-feedback-text');
                if (textarea && saved) textarea.value = saved;
                const skillsLine = card.querySelector('.skill-tags')?.closest('p');
                if (skillsLine) {
                    skillsLine.before(block);
                } else {
                    const feedbackDiv = card.querySelector('.feedback');
                    if (feedbackDiv) feedbackDiv.before(block);
                }
            }

            function removeCompanyFeedbackUI(card) {
                card?.querySelector('.company-feedback-input')?.remove();
            }

            function syncAppliedStageUI(card) {
                if (!card) return;
                const stopped = card.querySelector('.stopped-wrap input')?.checked;
                if (stopped) ensureCompanyFeedbackUI(card);
                else removeCompanyFeedbackUI(card);
            }

            function removeCardFromAppliedStages(card) {
                if (appliedStagePanels.includes(card.parentElement)) card.remove();
            }

            function portraitHasUnsavedChanges() {
                if (!portraitEditor) return false;
                return portraitDraftPending || portraitEditor.value !== portraitCommitted;
            }

            function setMode(mode) {
                if (currentMode === 'portrait' && mode !== 'portrait' && portraitHasUnsavedChanges()) {
                    const leave = window.confirm('Portrait has unsaved changes. Leave without saving?');
                    if (!leave) return;
                }
                const enteringPortrait = mode === 'portrait' && currentMode !== 'portrait';
                currentMode = mode;
                const isRelevant = mode === 'relevant';
                const isNotRelevant = mode === 'not relevant';
                const isApplied = mode === 'applied';
                const isInterview = mode === 'interview';
                const isStopped = mode === 'stopped';
                const isSkills = mode === 'skills';
                const isPortrait = mode === 'portrait';
                panelRelevant.classList.toggle('hidden', !isRelevant);
                panelNotRelevant.classList.toggle('hidden', !isNotRelevant);
                panelApplied.classList.toggle('hidden', !isApplied);
                panelInterview.classList.toggle('hidden', !isInterview);
                panelStopped.classList.toggle('hidden', !isStopped);
                panelSkills.classList.toggle('hidden', !isSkills);
                panelPortrait.classList.toggle('hidden', !isPortrait);
                btnRelevant.classList.toggle('active', isRelevant);
                btnNotRelevant.classList.toggle('active', isNotRelevant);
                btnApplied.classList.toggle('active', isApplied);
                btnInterview.classList.toggle('active', isInterview);
                btnStopped.classList.toggle('active', isStopped);
                btnSkills.classList.toggle('active', isSkills);
                btnPortrait.classList.toggle('active', isPortrait);
                if (enteringPortrait) {
                    refreshPortraitFromServer();
                }
            }

            function updatePortraitStatus() {
                if (!portraitStatus || !portraitEditor) return;
                if (portraitDraftPending) {
                    portraitStatus.textContent = 'Review draft — edit if needed, then Save portrait';
                    return;
                }
                if (portraitEditor.value !== portraitCommitted) {
                    portraitStatus.textContent = 'Unsaved edits';
                    return;
                }
                portraitStatus.textContent = portraitCommitted.trim() ? 'Saved' : '';
            }

            async function refreshPortraitFromServer() {
                if (!portraitEditor || portraitDraftPending) return;
                try {
                    const response = await fetch(apiUrl('/api/portrait'), { cache: 'no-store' });
                    if (!response.ok) return;
                    const data = await response.json();
                    if (!data.ok) return;
                    portraitCommitted = data.text || '';
                    portraitEditor.value = portraitCommitted;
                    updatePortraitStatus();
                } catch (_err) {
                    // Static file:// report or server unavailable — keep embedded text.
                }
            }

            async function regeneratePortrait(btnEl) {
                if (!portraitEditor) return;
                if (
                    portraitEditor.value !== portraitCommitted
                    && !portraitDraftPending
                    && !window.confirm('Replace unsaved edits with a new generated draft?')
                ) {
                    return;
                }
                btnEl.disabled = true;
                portraitStatus.textContent = 'Generating…';
                try {
                    const response = await fetch(apiUrl('/api/portrait/generate'), {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                    });
                    const data = await response.json();
                    if (!response.ok || !data.ok) {
                        throw new Error(data.error || 'Generation failed');
                    }
                    portraitEditor.value = data.draft || '';
                    portraitDraftPending = true;
                    if (portraitDiff && portraitDiffWrap) {
                        portraitDiff.innerHTML = data.diff_html || '';
                        portraitDiffWrap.classList.remove('hidden');
                    }
                    updatePortraitStatus();
                } catch (err) {
                    portraitStatus.textContent = '';
                    alert(`Failed to generate portrait: ${err.message}`);
                } finally {
                    btnEl.disabled = false;
                }
            }

            async function savePortrait(btnEl) {
                if (!portraitEditor) return;
                btnEl.disabled = true;
                portraitStatus.textContent = 'Saving…';
                try {
                    const response = await fetch(apiUrl('/api/portrait/save'), {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ text: portraitEditor.value }),
                    });
                    const data = await response.json();
                    if (!response.ok || !data.ok) {
                        throw new Error(data.error || 'Save failed');
                    }
                    portraitCommitted = data.text || portraitEditor.value;
                    portraitDraftPending = false;
                    if (portraitDiffWrap) {

            async function setRelevant(jobId, isRelevant, inputEl) {
                const signal = isRelevant ? 'relevant' : 'not relevant';
                const card = inputEl.closest('.card');
                const statusEl = card ? card.querySelector('.feedback-status') : null;
                if (statusEl) statusEl.textContent = 'Saving...';
                try {
                    const response = await fetch(apiUrl('/api/feedback'), {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ job_id: jobId, signal })
                    });
                    const data = await response.json();
                    if (!response.ok || !data.ok) {
                        throw new Error(data.error || 'Request failed');
                    }
                    if (statusEl) statusEl.textContent = `Saved: ${signal}`;
                    if (signal === 'not relevant') {
                        const appliedCheckbox = card ? card.querySelector('.applied-wrap input') : null;
                        if (appliedCheckbox) appliedCheckbox.checked = false;
                        const interviewCheckbox = card ? card.querySelector('.interview-wrap input') : null;
                        const stoppedCheckbox = card ? card.querySelector('.stopped-wrap input') : null;
                        if (interviewCheckbox) interviewCheckbox.checked = false;
                        if (stoppedCheckbox) stoppedCheckbox.checked = false;
                        if (card) removeCompanyFeedbackUI(card);
                    }
                    const viewedCheckbox = card ? card.querySelector('.viewed-wrap input') : null;
                    let isViewed = viewedCheckbox ? viewedCheckbox.checked : false;
                    if (signal === 'not relevant' && viewedCheckbox && !isViewed) {
                        const viewedResponse = await fetch(apiUrl('/api/viewed'), {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ job_id: jobId, viewed: true })
                        });
                        const viewedData = await viewedResponse.json();
                        if (!viewedResponse.ok || !viewedData.ok) {
                            throw new Error(viewedData.error || 'Failed to update viewed');
                        }
                        viewedCheckbox.checked = true;
                        isViewed = true;
                    }
                    const targetPanel = signal === 'relevant' ? panelRelevant : panelNotRelevant;
                    if (card && !isViewed && card.parentElement !== targetPanel) {
                        targetPanel.prepend(card);
                    } else if (card && isViewed) {
                        bumpPanelTotal(card.parentElement, -1);
                        card.remove();
                    }
                    refreshCounts();
                } catch (err) {
                    if (statusEl) statusEl.textContent = `Error: ${err.message}. Start: python -m spejder.cli serve-gui`;
                    inputEl.checked = !isRelevant;
                }
            }

                        const relevantCheckbox = card ? card.querySelector('.relevant-wrap input') : null;
                        const targetPanel = relevantCheckbox && relevantCheckbox.checked ? panelRelevant : panelNotRelevant;
                        bumpPanelTotal(targetPanel, 1);

            let skillsTableSort = null;

            function syncSkillsRowSortDataset(row, sortKey, enabled) {
                if (sortKey === 'has_skill') {
                    row.dataset.sortHasSkill = enabled ? '1' : '0';
                } else if (sortKey === 'want_learn') {
                    row.dataset.sortWantLearn = enabled ? '1' : '0';
                }
                if (skillsTableSort && skillsTableSort.sortKey() === sortKey) {
                    skillsTableSort.applySort();
                }
            }

            function initSkillsTableSort() {
                const table = document.getElementById('skills-table');
                if (!table) return;

                const tbody = table.querySelector('tbody');
                const headers = Array.from(table.querySelectorAll('th.skills-sortable'));
                if (!tbody || headers.length === 0) return;

                const sortState = { key: 'name', dir: 1 };

                function rowValue(row, key) {
                    if (key === 'name') return (row.dataset.sortName || '').toLowerCase();
                    if (key === 'source') return (row.dataset.sortSource || '').toLowerCase();
                    if (key === 'position_pct') return Number.parseFloat(row.dataset.sortPositionPct || '0') || 0;
                    if (key === 'occurrences') return Number.parseInt(row.dataset.sortOccurrences || '0', 10) || 0;
                    if (key === 'has_skill') return Number.parseInt(row.dataset.sortHasSkill || '0', 10) || 0;
                    if (key === 'want_learn') return Number.parseInt(row.dataset.sortWantLearn || '0', 10) || 0;
                    return '';
                }

                function compareRows(a, b) {
                    const left = rowValue(a, sortState.key);
                    const right = rowValue(b, sortState.key);
                    let cmp = 0;
                    if (typeof left === 'number' && typeof right === 'number') {
                        cmp = left - right;
                    } else {
                        cmp = String(left).localeCompare(String(right));
                    }
                    if (cmp === 0) {
                        cmp = String(a.dataset.sortName || '').localeCompare(String(b.dataset.sortName || ''));
                    }
                    return cmp * sortState.dir;
                }

                function applySort() {
                    const rows = Array.from(tbody.querySelectorAll('tr'));
                    rows.sort(compareRows);
                    rows.forEach((row) => tbody.appendChild(row));
                    headers.forEach((header) => {
                        const active = header.dataset.sortKey === sortState.key;
                        header.classList.toggle('skills-sort-active', active);
                        header.classList.toggle('skills-sort-desc', active && sortState.dir < 0);
                        if (active) {
                            header.setAttribute('aria-sort', sortState.dir > 0 ? 'ascending' : 'descending');
                        } else {
                            header.removeAttribute('aria-sort');
                        }
                    });
                }

                headers.forEach((header) => {
                    header.setAttribute('tabindex', '0');
                    header.setAttribute('role', 'button');
                    const activateSort = () => {
                        const key = header.dataset.sortKey || 'name';
                        if (sortState.key === key) {
                            sortState.dir *= -1;
                        } else {
                            sortState.key = key;
                            sortState.dir = (key === 'name' || key === 'source') ? 1 : -1;
                        }
                        applySort();
                    };
                    header.addEventListener('click', activateSort);
                    header.addEventListener('keydown', (event) => {
                        if (event.key === 'Enter' || event.key === ' ') {
                            event.preventDefault();
                            activateSort();
                        }
                    });
                });

                skillsTableSort = {
                    applySort,
                    sortKey: () => sortState.key,
                };
                applySort();
            }
