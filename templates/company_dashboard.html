<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Company Positions: {{ safe_company_label }}</title>
        <style>
            body { font-family: Arial, sans-serif; margin: 24px; background: #f7f7f7; color: #111; }
            h1 { margin-bottom: 8px; }
            .subtitle { margin: 0 0 12px 0; color: #555; }
            .subtitle a { color: #0a58ca; }
            .controls { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
            .mode-btn { border: 1px solid #bbb; background: #fff; border-radius: 8px; padding: 8px 12px; cursor: pointer; }
            .mode-btn.active { border-color: #0a58ca; font-weight: 700; }
            .grid { display: grid; gap: 12px; }
            .card { background: #fff; border: 1px solid #ddd; border-radius: 10px; padding: 12px; position: relative; }
            .easy-apply-card { border-color: #d7a127; box-shadow: inset 0 0 0 1px #f6d36b; }
            .easy-apply-badge { display: inline-block; margin-left: 6px; padding: 2px 8px; border-radius: 999px; border: 1px solid #d7a127; background: #fff6d9; color: #7a5a00; font-size: 11px; font-weight: 700; vertical-align: middle; }
            .card p { margin: 6px 0; }
            .skill-tags { display: inline-flex; flex-wrap: wrap; gap: 6px; vertical-align: middle; }
            .skill-tag { display: inline-block; padding: 2px 8px; border-radius: 999px; border: 1px solid #c9d6f0; background: #eef4ff; color: #1f3a6d; font-size: 12px; }
            .skills-empty { color: #777; font-size: 12px; }
            .manual-status { display: inline-block; font-size: 11px; font-weight: 700; margin: 4px 0 8px 0; padding: 2px 8px; border-radius: 999px; }
            .manual-status.done { color: #114b1f; background: #e5f6e9; border: 1px solid #9ed3ab; }
            .manual-status.todo { color: #6b5a00; background: #fff8db; border: 1px solid #e4d08a; }
            .applied-manual-input { margin: 8px 0; padding: 8px; border: 1px dashed #c7d5ee; border-radius: 8px; background: #f7fbff; }
            .applied-manual-input p { margin: 0 0 6px 0; font-size: 12px; color: #1f3a6d; }
            .cover-letter-section { display: block; margin: 8px 0; }
            .cover-letter-wrap { display: block; margin: 0 0 6px 0; font-size: 12px; font-weight: 700; }
            .raw-append-input, .cover-letter-text { width: 100%; min-height: 120px; resize: vertical; border: 1px solid #c9d6f0; border-radius: 6px; padding: 8px; font-size: 12px; font-family: monospace; box-sizing: border-box; }
            .raw-append-btn, .cover-letter-btn { margin-top: 8px; border: 1px solid #0a58ca; color: #0a58ca; background: #fff; border-radius: 6px; padding: 6px 10px; cursor: pointer; }
            .raw-append-btn:disabled, .cover-letter-btn:disabled { opacity: 0.55; cursor: not-allowed; }
            .relevance-score, .applied-date { position: absolute; right: 10px; font-size: 11px; color: #9aa0a6; }
            .relevance-score { top: 8px; }
            .applied-date { bottom: 8px; }
            .card:has(.applied-date) .feedback,
            .card.has-applied-date .feedback { padding-right: 7.5rem; padding-bottom: 1.5rem; }
            .card:has(.applied-date) .company-feedback-input,
            .card.has-applied-date .company-feedback-input { margin-bottom: 1.25rem; }
            .feedback { display: flex; gap: 8px; align-items: center; margin-top: 8px; flex-wrap: wrap; }
            .relevant-wrap { font-size: 13px; color: #333; display: inline-flex; gap: 5px; align-items: center; }
            .viewed-wrap { font-size: 13px; color: #333; display: inline-flex; gap: 5px; align-items: center; }
            .applied-wrap { font-size: 13px; color: #333; display: inline-flex; gap: 5px; align-items: center; }
            .hidden-wrap { font-size: 13px; color: #333; display: inline-flex; gap: 5px; align-items: center; }
            .interview-wrap { font-size: 13px; color: #333; display: inline-flex; gap: 5px; align-items: center; }
            .stopped-wrap { font-size: 13px; color: #333; display: inline-flex; gap: 5px; align-items: center; }
            .company-feedback-input { margin: 8px 0; padding: 8px; border: 1px dashed #d8c7ee; border-radius: 8px; background: #faf7ff; }
            .company-feedback-input p { margin: 0 0 6px 0; font-size: 12px; color: #4a2d6d; }
            .company-feedback-text { width: 100%; min-height: 80px; resize: vertical; border: 1px solid #d8c7ee; border-radius: 6px; padding: 8px; font-size: 12px; box-sizing: border-box; }
            .company-feedback-btn { margin-top: 8px; border: 1px solid #6f42c1; color: #6f42c1; background: #fff; border-radius: 6px; padding: 6px 10px; cursor: pointer; }
            .feedback-status { font-size: 12px; color: #555; }
            a { color: #0a58ca; word-break: break-all; }
            .hidden { display: none; }
            .empty { background: #fff; border: 1px dashed #ccc; border-radius: 10px; padding: 12px; margin: 0; }
        </style>
    </head>
    <body>
        <h1>Company Positions</h1>
        <p class="subtitle"><a href="/report.html">Back to full report</a> · {{ safe_company_label }} · Total in DB: {{ len_company_items }}</p>
        <div class="controls">
            <button id="btn-relevant" class="mode-btn active" type="button">Relevant ({{ len_relevant_items }})</button>
            <button id="btn-not-relevant" class="mode-btn" type="button">Not relevant ({{ len_not_relevant_items }})</button>
            <button id="btn-applied" class="mode-btn" type="button">Applied ({{ len_applied_items }})</button>
            <button id="btn-interview" class="mode-btn" type="button">Interview ({{ len_interview_items }})</button>
            <button id="btn-stopped" class="mode-btn" type="button">Stopped ({{ len_stopped_items }})</button>
            <button id="btn-hidden" class="mode-btn" type="button">Hidden ({{ len_hidden_items }})</button>
            <button id="btn-edited-today" class="mode-btn" type="button">Edited today ({{ len_viewed_today_items }})</button>
        </div>
        <section id="panel-relevant" class="grid">{{ relevant_cards }}</section>
        <section id="panel-not-relevant" class="grid hidden">{{ not_relevant_cards }}</section>
        <section id="panel-applied" class="grid hidden">{{ applied_cards }}</section>
        <section id="panel-interview" class="grid hidden">{{ interview_cards }}</section>
        <section id="panel-stopped" class="grid hidden">{{ stopped_cards }}</section>
        <section id="panel-hidden" class="grid hidden">{{ hidden_cards }}</section>
        <section id="panel-edited-today" class="grid hidden">{{ viewed_today_cards }}</section>
        <script>
            const btnRelevant = document.getElementById('btn-relevant');
            const btnNotRelevant = document.getElementById('btn-not-relevant');
            const btnEditedToday = document.getElementById('btn-edited-today');
            const btnApplied = document.getElementById('btn-applied');
            const btnInterview = document.getElementById('btn-interview');
            const btnStopped = document.getElementById('btn-stopped');
            const btnHidden = document.getElementById('btn-hidden');
            const panelRelevant = document.getElementById('panel-relevant');
            const panelNotRelevant = document.getElementById('panel-not-relevant');
            const panelEditedToday = document.getElementById('panel-edited-today');
            const panelApplied = document.getElementById('panel-applied');
            const panelInterview = document.getElementById('panel-interview');
            const panelStopped = document.getElementById('panel-stopped');
            const panelHidden = document.getElementById('panel-hidden');
            const appliedStagePanels = [panelApplied, panelInterview, panelStopped];

            function apiUrl(path) {
                if (window.location.protocol === 'file:') {
                    return `http://127.0.0.1:8765${path}`;
                }
                return path;
            }

            function ensureEmptyState(panel) {
                const hasCards = panel.querySelector('.card') !== null;
                let emptyEl = panel.querySelector('.empty');
                if (!hasCards && !emptyEl) {
                    emptyEl = document.createElement('p');
                    emptyEl.className = 'empty';
                    emptyEl.textContent = 'No records found.';
                    panel.appendChild(emptyEl);
                }
                if (hasCards && emptyEl) {
                    emptyEl.remove();
                }
            }

            function bumpPanelTotal(panel, delta) {
                let btn = null;
                if (panel === panelRelevant) btn = btnRelevant;
                if (panel === panelNotRelevant) btn = btnNotRelevant;
                if (!btn) return;
                const current = Number.parseInt(btn.dataset.total || '0', 10) || 0;
                btn.dataset.total = String(Math.max(0, current + delta));
            }

            function refreshCounts() {
                btnRelevant.textContent = `Relevant (${panelRelevant.querySelectorAll('.card').length})`;
                btnNotRelevant.textContent = `Not relevant (${panelNotRelevant.querySelectorAll('.card').length})`;
                btnEditedToday.textContent = `Edited today (${panelEditedToday.querySelectorAll('.card').length})`;
                btnApplied.textContent = `Applied (${panelApplied.querySelectorAll('.card').length})`;
                btnInterview.textContent = `Interview (${panelInterview.querySelectorAll('.card').length})`;
                btnStopped.textContent = `Stopped (${panelStopped.querySelectorAll('.card').length})`;
                btnHidden.textContent = `Hidden (${panelHidden.querySelectorAll('.card').length})`;
                ensureEmptyState(panelRelevant);
                ensureEmptyState(panelNotRelevant);
                ensureEmptyState(panelEditedToday);
                ensureEmptyState(panelApplied);
                ensureEmptyState(panelInterview);
                ensureEmptyState(panelStopped);
                ensureEmptyState(panelHidden);
            }

            function resolveAppliedStage(card) {
                const onInterview = card.querySelector('.interview-wrap input')?.checked;
                const stopped = card.querySelector('.stopped-wrap input')?.checked;
                if (onInterview) return { panel: panelInterview, mode: 'interview' };
                if (stopped) return { panel: panelStopped, mode: 'stopped' };
                return { panel: panelApplied, mode: 'applied' };
            }

            function moveCardToAppliedStage(card) {
                const targetPanel = resolveAppliedStage(card).panel;
                if (card.parentElement !== targetPanel) targetPanel.prepend(card);
                syncAppliedStageUI(card);
            }

            function ensureCompanyFeedbackUI(card) {
                if (!card) return;
                const saved = card.querySelector('.company-feedback-text')?.value
                    || card.getAttribute('data-company-feedback')
                    || '';
                if (card.querySelector('.company-feedback-input')) {
                    const existing = card.querySelector('.company-feedback-text');
                    if (existing && saved && !existing.value) existing.value = saved;
                    return;
                }
                const jobId = card.getAttribute('data-job-id');
                const block = document.createElement('div');
                block.className = 'company-feedback-input';
                block.innerHTML = `
                    <p><strong>Company feedback</strong></p>
                    <textarea class="company-feedback-text" placeholder="Notes from the company..."></textarea>
                    <div><button type="button" class="company-feedback-btn" onclick="saveCompanyFeedback(${jobId}, this)">Save feedback</button></div>
                `.trim();
                const textarea = block.querySelector('.company-feedback-text');
                if (textarea && saved) textarea.value = saved;
                const skillsLine = card.querySelector('.skill-tags')?.closest('p');
                if (skillsLine) {
                    skillsLine.before(block);
                } else {
                    const feedbackDiv = card.querySelector('.feedback');
                    if (feedbackDiv) feedbackDiv.before(block);
                }
            }

            function removeCompanyFeedbackUI(card) {
                card?.querySelector('.company-feedback-input')?.remove();
            }

            function removeAppliedOnlyUI(card) {
                if (!card) return;
                card.querySelectorAll(
                    '.cover-letter-section, .applied-manual-input, .manual-status, '
                    + '.applied-date, .interview-wrap, .stopped-wrap'
                ).forEach((el) => el.remove());
                card.classList.remove('has-applied-date');
            }

            function syncAppliedStageUI(card) {
                if (!card) return;
                const stopped = card.querySelector('.stopped-wrap input')?.checked;
                if (stopped) ensureCompanyFeedbackUI(card);
                else removeCompanyFeedbackUI(card);
            }

            function removeCardFromAppliedStages(card) {
                if (appliedStagePanels.includes(card.parentElement)) card.remove();
            }

            function setMode(mode) {
                const isRelevant = mode === 'relevant';
                const isNotRelevant = mode === 'not relevant';
                const isEditedToday = mode === 'edited today';
                const isApplied = mode === 'applied';
                const isInterview = mode === 'interview';
                const isStopped = mode === 'stopped';
                const isHiddenTab = mode === 'hidden';
                panelRelevant.classList.toggle('hidden', !isRelevant);
                panelNotRelevant.classList.toggle('hidden', !isNotRelevant);
                panelEditedToday.classList.toggle('hidden', !isEditedToday);
                panelApplied.classList.toggle('hidden', !isApplied);
                panelInterview.classList.toggle('hidden', !isInterview);
                panelStopped.classList.toggle('hidden', !isStopped);
                panelHidden.classList.toggle('hidden', !isHiddenTab);
                btnRelevant.classList.toggle('active', isRelevant);
                btnNotRelevant.classList.toggle('active', isNotRelevant);
                btnEditedToday.classList.toggle('active', isEditedToday);
                btnApplied.classList.toggle('active', isApplied);
                btnInterview.classList.toggle('active', isInterview);
                btnStopped.classList.toggle('active', isStopped);
                btnHidden.classList.toggle('active', isHiddenTab);
            }

            btnRelevant.addEventListener('click', () => setMode('relevant'));
            btnNotRelevant.addEventListener('click', () => setMode('not relevant'));
            btnApplied.addEventListener('click', () => setMode('applied'));
            btnInterview.addEventListener('click', () => setMode('interview'));
            btnStopped.addEventListener('click', () => setMode('stopped'));
            btnHidden.addEventListener('click', () => setMode('hidden'));
            btnEditedToday.addEventListener('click', () => setMode('edited today'));

            async function setRelevant(jobId, isRelevant, inputEl) {
                const signal = isRelevant ? 'relevant' : 'not relevant';
                const card = inputEl.closest('.card');
                const statusEl = card ? card.querySelector('.feedback-status') : null;
                if (statusEl) statusEl.textContent = 'Saving...';
                try {
                    const response = await fetch(apiUrl('/api/feedback'), {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ job_id: jobId, signal })
                    });
                    const data = await response.json();
                    if (!response.ok || !data.ok) {
                        throw new Error(data.error || 'Request failed');
                    }
                    const appliedCheckbox = card ? card.querySelector('.applied-wrap input') : null;
                    const viewedCheckbox = card ? card.querySelector('.viewed-wrap input') : null;
                    const hiddenCheckbox = card ? card.querySelector('.hidden-wrap input') : null;
                    if (signal === 'not relevant') {
                        if (appliedCheckbox) appliedCheckbox.checked = false;
                        const interviewCheckbox = card ? card.querySelector('.interview-wrap input') : null;
                        const stoppedCheckbox = card ? card.querySelector('.stopped-wrap input') : null;
                        if (interviewCheckbox) interviewCheckbox.checked = false;
                        if (stoppedCheckbox) stoppedCheckbox.checked = false;
                        if (card) removeCompanyFeedbackUI(card);
                        if (viewedCheckbox && !viewedCheckbox.checked) {
                            const viewedResponse = await fetch(apiUrl('/api/viewed'), {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ job_id: jobId, viewed: true })
                            });
                            const viewedData = await viewedResponse.json();
                            if (!viewedResponse.ok || !viewedData.ok) {
                                throw new Error(viewedData.error || 'Failed to update viewed');
                            }
                            viewedCheckbox.checked = true;
                            if (hiddenCheckbox) hiddenCheckbox.checked = false;
                        }
                    }
                    if (card) {
                        const stillHidden = Boolean(hiddenCheckbox && hiddenCheckbox.checked);
                        const isViewedNow = Boolean(viewedCheckbox && viewedCheckbox.checked);
                        if (!stillHidden && appliedCheckbox && appliedCheckbox.checked) {
                            moveCardToAppliedStage(card);
                        } else if (!stillHidden && isViewedNow) {
                            if (card.parentElement !== panelEditedToday) panelEditedToday.prepend(card);
                        } else if (!stillHidden) {
                            const targetPanel = signal === 'relevant' ? panelRelevant : panelNotRelevant;
                            if (card.parentElement !== targetPanel) targetPanel.prepend(card);
                        }
                    }
                    if (statusEl) statusEl.textContent = `Saved: ${signal}`;
                    refreshCounts();
                } catch (err) {
                    if (statusEl) statusEl.textContent = `Error: ${err.message}. Start: python -m spejder.cli serve-gui`;
                    inputEl.checked = !isRelevant;
                }
            }

            async function setViewed(jobId, viewed, inputEl) {
                const card = inputEl.closest('.card');
                const statusEl = card ? card.querySelector('.feedback-status') : null;
                if (statusEl) statusEl.textContent = 'Saving...';
                try {
                    const response = await fetch(apiUrl('/api/viewed'), {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ job_id: jobId, viewed })
                    });
                    const data = await response.json();
                    if (!response.ok || !data.ok) {
                        throw new Error(data.error || 'Request failed');
                    }
                    if (card) {
                        const relevantCheckbox = card.querySelector('.relevant-wrap input');
                        const appliedCheckbox = card.querySelector('.applied-wrap input');
                        const interviewCheckbox = card.querySelector('.interview-wrap input');
                        const stoppedCheckbox = card.querySelector('.stopped-wrap input');
                        if (!viewed) {
                            if (appliedCheckbox) appliedCheckbox.checked = false;
                            if (interviewCheckbox) interviewCheckbox.checked = false;
                            if (stoppedCheckbox) stoppedCheckbox.checked = false;
                            removeCardFromAppliedStages(card);
                            const targetPanel = relevantCheckbox && relevantCheckbox.checked ? panelRelevant : panelNotRelevant;
                            if (card.parentElement !== targetPanel) targetPanel.prepend(card);
                        } else {
                            const hiddenCheckbox = card.querySelector('.hidden-wrap input');
                            if (hiddenCheckbox) hiddenCheckbox.checked = false;
                            if (!appliedStagePanels.includes(card.parentElement)) {
                                if (card.parentElement !== panelEditedToday) panelEditedToday.prepend(card);
                            }
                        }
                    }
                    if (statusEl) statusEl.textContent = `Saved: ${viewed ? 'viewed' : 'unviewed'}`;
                    refreshCounts();
                } catch (err) {
                    if (statusEl) statusEl.textContent = `Error: ${err.message}. Start: python -m spejder.cli serve-gui`;
                    inputEl.checked = !viewed;
                }
            }

            async function setApplied(jobId, applied, inputEl) {
                const card = inputEl.closest('.card');
                const statusEl = card ? card.querySelector('.feedback-status') : null;
                if (statusEl) statusEl.textContent = 'Saving...';
                try {
                    const response = await fetch(apiUrl('/api/applied'), {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ job_id: jobId, applied })
                    });
                    const data = await response.json();
                    if (!response.ok || !data.ok) {
                        throw new Error(data.error || 'Request failed');
                    }
                    if (card) {
                        const relevantCheckbox = card.querySelector('.relevant-wrap input');
                        const viewedCheckbox = card.querySelector('.viewed-wrap input');
                        const interviewCheckbox = card.querySelector('.interview-wrap input');
                        const stoppedCheckbox = card.querySelector('.stopped-wrap input');
                        if (applied) {
                            if (relevantCheckbox) relevantCheckbox.checked = true;
                            if (viewedCheckbox) viewedCheckbox.checked = true;
                            const hiddenCheckbox = card.querySelector('.hidden-wrap input');
                            if (hiddenCheckbox) hiddenCheckbox.checked = false;
                            moveCardToAppliedStage(card);
                        } else {
                            if (interviewCheckbox) interviewCheckbox.checked = false;
                            if (stoppedCheckbox) stoppedCheckbox.checked = false;
                            removeCompanyFeedbackUI(card);
                            removeCardFromAppliedStages(card);
                            const stillViewed = Boolean(viewedCheckbox && viewedCheckbox.checked);
                            if (stillViewed) {
                                if (card.parentElement !== panelEditedToday) panelEditedToday.prepend(card);
                            } else {
                                const targetPanel = relevantCheckbox && relevantCheckbox.checked ? panelRelevant : panelNotRelevant;
                                if (card.parentElement !== targetPanel) targetPanel.prepend(card);
                                setMode(relevantCheckbox && relevantCheckbox.checked ? 'relevant' : 'not relevant');
                            }
                        }
                    }
                    if (statusEl) statusEl.textContent = `Saved: ${applied ? 'applied' : 'not applied'}`;
                    refreshCounts();
                } catch (err) {
                    if (statusEl) statusEl.textContent = `Error: ${err.message}. Start: python -m spejder.cli serve-gui`;
                    inputEl.checked = !applied;
                }
            }

            async function setOnInterview(jobId, onInterview, inputEl) {
                const card = inputEl.closest('.card');
                const statusEl = card ? card.querySelector('.feedback-status') : null;
                if (statusEl) statusEl.textContent = 'Saving...';
                try {
                    const response = await fetch(apiUrl('/api/interview'), {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ job_id: jobId, on_interview: onInterview })
                    });
                    const data = await response.json();
                    if (!response.ok || !data.ok) {
                        throw new Error(data.error || 'Request failed');
                    }
                    if (card) {
                        const stoppedCheckbox = card.querySelector('.stopped-wrap input');
                        if (onInterview && stoppedCheckbox) stoppedCheckbox.checked = false;
                        moveCardToAppliedStage(card);
                        setMode(resolveAppliedStage(card).mode);
                    }
                    if (statusEl) statusEl.textContent = `Saved: ${onInterview ? 'on interview' : 'not on interview'}`;
                    refreshCounts();
                } catch (err) {
                    if (statusEl) statusEl.textContent = `Error: ${err.message}. Start: python -m spejder.cli serve-gui`;
                    inputEl.checked = !onInterview;
                }
            }

            async function setInterviewStopped(jobId, stopped, inputEl) {
                const card = inputEl.closest('.card');
                const statusEl = card ? card.querySelector('.feedback-status') : null;
                if (statusEl) statusEl.textContent = 'Saving...';
                try {
                    const response = await fetch(apiUrl('/api/interview/stopped'), {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ job_id: jobId, stopped })
                    });
                    const data = await response.json();
                    if (!response.ok || !data.ok) {
                        throw new Error(data.error || 'Request failed');
                    }
                    if (card) {
                        const interviewCheckbox = card.querySelector('.interview-wrap input');
                        if (stopped && interviewCheckbox) interviewCheckbox.checked = false;
                        moveCardToAppliedStage(card);
                        setMode(resolveAppliedStage(card).mode);
                    }
                    if (statusEl) statusEl.textContent = `Saved: ${stopped ? 'stopped' : 'not stopped'}`;
                    refreshCounts();
                } catch (err) {
                    if (statusEl) statusEl.textContent = `Error: ${err.message}. Start: python -m spejder.cli serve-gui`;
                    inputEl.checked = !stopped;
                }
            }

            async function setHidden(jobId, hidden, inputEl) {
                const card = inputEl.closest('.card');
                const statusEl = card ? card.querySelector('.feedback-status') : null;
                if (statusEl) statusEl.textContent = 'Saving...';
                try {
                    const response = await fetch(apiUrl('/api/hidden'), {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ job_id: jobId, hidden })
                    });
                    const data = await response.json();
                    if (!response.ok || !data.ok) {
                        throw new Error(data.error || 'Request failed');
                    }
                    if (card) {
                        const viewedCheckbox = card.querySelector('.viewed-wrap input');
                        const appliedCheckbox = card.querySelector('.applied-wrap input');
                        const interviewCheckbox = card.querySelector('.interview-wrap input');
                        const stoppedCheckbox = card.querySelector('.stopped-wrap input');
                        const relevantCheckbox = card.querySelector('.relevant-wrap input');
                        if (hidden) {
                            if (viewedCheckbox) viewedCheckbox.checked = false;
                            if (appliedCheckbox) appliedCheckbox.checked = false;
                            if (interviewCheckbox) interviewCheckbox.checked = false;
                            if (stoppedCheckbox) stoppedCheckbox.checked = false;
                            removeCompanyFeedbackUI(card);
                            removeAppliedOnlyUI(card);
                            if (card.parentElement !== panelHidden) panelHidden.prepend(card);
                        } else {
                            const targetPanel = relevantCheckbox && relevantCheckbox.checked ? panelRelevant : panelNotRelevant;
                            if (card.parentElement !== targetPanel) targetPanel.prepend(card);
                        }
                    }
                    if (statusEl) statusEl.textContent = `Saved: ${hidden ? 'hidden' : 'unhidden'}`;
                    refreshCounts();
                } catch (err) {
                    if (statusEl) statusEl.textContent = `Error: ${err.message}. Start: python -m spejder.cli serve-gui`;
                    inputEl.checked = !hidden;
                }
            }

            async function saveCompanyFeedback(jobId, btnEl) {
                const card = btnEl.closest('.card');
                const statusEl = card ? card.querySelector('.feedback-status') : null;
                const inputEl = card ? card.querySelector('.company-feedback-text') : null;
                const feedback = inputEl ? inputEl.value : '';
                btnEl.disabled = true;
                if (statusEl) statusEl.textContent = 'Saving...';
                try {
                    const response = await fetch(apiUrl('/api/interview/feedback'), {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ job_id: jobId, feedback })
                    });
                    const data = await response.json();
                    if (!response.ok || !data.ok) {
                        throw new Error(data.error || 'Request failed');
                    }
                    if (statusEl) statusEl.textContent = 'Saved: company feedback';
                } catch (err) {
                    if (statusEl) statusEl.textContent = `Error: ${err.message}`;
                } finally {
                    btnEl.disabled = false;
                }
            }

            async function appendAppliedRawText(jobId, btnEl) {
                const card = btnEl.closest('.card');
                const statusEl = card ? card.querySelector('.feedback-status') : null;
                const inputEl = card ? card.querySelector('.raw-append-input') : null;
                const text = inputEl ? inputEl.value : '';
                if (!text || !text.trim()) {
                    if (statusEl) statusEl.textContent = 'Enter description text first';
                    return;
                }

                btnEl.disabled = true;
                if (statusEl) statusEl.textContent = '';
                try {
                    const response = await fetch(apiUrl('/api/applied/raw-text'), {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ job_id: jobId, text })
                    });
                    const data = await response.json();
                    if (!response.ok || !data.ok) {
                        throw new Error(data.error || 'Request failed');
                    }
                    if (statusEl) statusEl.textContent = '';
                } catch (err) {
                    if (statusEl) statusEl.textContent = `Error: ${err.message}`;
                    btnEl.disabled = false;
                }
            }

            async function setCoverLetterRequested(jobId, requested, inputEl) {
                const card = inputEl.closest('.card');
                const statusEl = card ? card.querySelector('.feedback-status') : null;
                if (statusEl) statusEl.textContent = '';
                try {
                    const response = await fetch(apiUrl('/api/applied/cover-letter/request'), {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ job_id: jobId, requested })
                    });
                    const data = await response.json();
                    if (!response.ok || !data.ok) {
                        throw new Error(data.error || 'Request failed');
                    }
                    let inputBlock = card ? card.querySelector('.cover-letter-input') : null;
                    if (requested) {
                        if (!inputBlock && card) {
                            const section = card.querySelector('.cover-letter-section');
                            inputBlock = document.createElement('div');
                            inputBlock.className = 'applied-manual-input cover-letter-input';
                            inputBlock.innerHTML = '<textarea class="cover-letter-text" placeholder="Paste cover letter here..."></textarea><div><button type="button" class="cover-letter-btn" onclick="saveCoverLetter(' + jobId + ', this)">Save</button></div>';
                            if (section) {
                                section.appendChild(inputBlock);
                            }
                        }
                    } else if (inputBlock) {
                        inputBlock.remove();
                    }
                    if (statusEl) statusEl.textContent = '';
                } catch (err) {
                    inputEl.checked = !requested;
                    if (statusEl) statusEl.textContent = `Error: ${err.message}. Start: python -m spejder.cli serve-gui`;
                }
            }

            async function saveCoverLetter(jobId, btnEl) {
                const card = btnEl.closest('.card');
                const statusEl = card ? card.querySelector('.feedback-status') : null;
                const inputEl = card ? card.querySelector('.cover-letter-text') : null;
                const text = inputEl ? inputEl.value : '';
                if (!text || !text.trim()) {
                    if (statusEl) statusEl.textContent = 'Enter cover letter text first';
                    return;
                }

                btnEl.disabled = true;
                if (statusEl) statusEl.textContent = '';
                try {
                    const response = await fetch(apiUrl('/api/applied/cover-letter'), {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ job_id: jobId, text })
                    });
                    const data = await response.json();
                    if (!response.ok || !data.ok) {
                        throw new Error(data.error || 'Request failed');
                    }
                    if (statusEl) statusEl.textContent = '';
                } catch (err) {
                    if (statusEl) statusEl.textContent = `Error: ${err.message}. Start: python -m spejder.cli serve-gui`;
                    btnEl.disabled = false;
                }
            }

            window.setRelevant = setRelevant;
            window.setViewed = setViewed;
            window.setApplied = setApplied;
            window.setOnInterview = setOnInterview;
            window.setInterviewStopped = setInterviewStopped;
            window.setHidden = setHidden;
            window.saveCompanyFeedback = saveCompanyFeedback;
            window.appendAppliedRawText = appendAppliedRawText;
            window.setCoverLetterRequested = setCoverLetterRequested;
            window.saveCoverLetter = saveCoverLetter;
            refreshCounts();
        </script>
    </body>
</html>
