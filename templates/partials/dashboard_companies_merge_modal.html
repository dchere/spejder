<div id="company-merge-modal" class="company-merge-modal hidden" hidden aria-hidden="true">
                <div class="company-merge-modal-backdrop" data-company-merge-dismiss tabindex="-1"></div>
                <div class="company-merge-modal-panel" role="dialog" aria-modal="true" aria-labelledby="company-merge-title">
                    <h2 id="company-merge-title" class="company-merge-modal-title">Merge companies</h2>
                    <label class="company-merge-modal-label" for="company-merge-display-name">Display name</label>
                    <input id="company-merge-display-name" class="company-merge-display-name" type="text" autocomplete="off" spellcheck="false">
                    <p class="company-merge-modal-hint">Click a name to use it, or copy from the list.</p>
                    <ul id="company-merge-name-list" class="company-merge-name-list"></ul>
                    <div class="company-merge-modal-actions">
                        <button type="button" id="company-merge-cancel" class="company-merge-cancel-btn">Cancel</button>
                        <button type="button" id="company-merge-confirm" class="company-merge-btn">Merge</button>
                    </div>
                </div>
            </div>
