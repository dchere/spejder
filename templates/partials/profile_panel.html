<section id="panel-profile" class="profile-wrap hidden">
    <div class="profile-toolbar">
        <button id="btn-profile-save" class="profile-btn profile-save-btn" type="button" onclick="saveProfile(this)" disabled>Save profile</button>
        <span id="profile-status" class="profile-status"></span>
    </div>
    <p class="profile-panel-help">Save sends only fields you changed (merged into the live profile). Keyword, score, and skill-weight edits apply to new scoring immediately; existing jobs keep their stored scores until you run <strong>Sync inbox</strong> or <strong>Regenerate report</strong> (or rescore via CLI).</p>
    <div id="profile-form" class="profile-groups"></div>
</section>
